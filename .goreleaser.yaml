version: 2
project_name: teleskope

builds:
  - main: ./cmd/teleskope
    binary: teleskope
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/kuraudo-lab/teleskope/internal/buildinfo.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

# Publishing is a separate job, using the exact archives tested on native runners.
release:
  disable: true
changelog:
  disable: true
